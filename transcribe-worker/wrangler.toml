name = "ehk-transcribe"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Public (non-secret) variables:
[vars]
# ALLOWED_ORIGIN accepts a single origin or a comma-separated list, e.g.
#   ALLOWED_ORIGIN = "https://sescc.github.io"
#   ALLOWED_ORIGIN = "https://sescc.github.io,https://notes.mydomain.com"
# The Worker reflects the request's Origin back if it's in the list.
# Leave unset to allow all origins (*).
# ALLOWED_ORIGIN = "https://sescc.github.io"

# GROQ_API_KEY is NOT set here — it is a secret set via:
#   npx wrangler secret put GROQ_API_KEY
