name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install TypeScript
        run: npm install -g typescript

      - name: Compile TypeScript (app)
        run: tsc

      - name: Compile TypeScript (service worker)
        run: tsc -p tsconfig.sw.json

      - name: Inject build version into service worker
        run: |
          BUILD_VERSION="${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          echo "Injecting build version: $BUILD_VERSION"
          sed -i "s/__BUILD_VERSION__/${BUILD_VERSION}/g" sw.js
          # Verify the placeholder was replaced
          if grep -q "__BUILD_VERSION__" sw.js; then
            echo "ERROR: build version placeholder not replaced" >&2
            exit 1
          fi
          # sw.js is registered as a classic script: fail if it can't parse as one (e.g. a stray `export {}`).
          node -e "new Function(require('fs').readFileSync('sw.js','utf8'))"

      - name: Prepare deploy directory
        run: |
          mkdir -p _site
          cp index.html app.css manifest.webmanifest sw.js config.js _site/
          cp -r src _site/src
          cp -r icons _site/icons
          # Ensure Jekyll processing is disabled on the deployed site
          touch _site/.nojekyll
          # Remove TypeScript sources from deploy (keep only compiled JS)
          find _site/src -name '*.ts' -delete
          rm -f _site/src/*.map _site/src/**/*.map 2>/dev/null || true
          # Remove compiled test files (emitted by tsc beside the sources; not needed at runtime)
          find _site/src \( -name '*.chartest.js' -o -name '*.proptest.js' \) -delete

      - name: Inject Google Drive OAuth config into config.js
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          OAUTH_BROKER_URL: ${{ secrets.OAUTH_BROKER_URL }}
          # Repository variable (Settings > Secrets and variables > Actions > Variables).
          # Forks that don't want Google Drive backup set it to "off".
          DRIVE_BACKUP: ${{ vars.DRIVE_BACKUP }}
        run: |
          # Opt-out for forks: DRIVE_BACKUP=off skips the secret check and the
          # client/broker injection. The literal "off" is injected (never the raw
          # variable value) and the app then hides Cloud Backup entirely.
          if [ "${DRIVE_BACKUP,,}" = "off" ]; then
            echo "DRIVE_BACKUP=off: Google Drive backup is disabled for this deployment."
            sed -i "s|@@DRIVE_BACKUP@@|off|g" _site/config.js
            node --check _site/config.js
            exit 0
          fi
          # Default (the owner's deploy): Google Drive backup is a required
          # feature, so refuse to deploy without it.
          missing=0
          for name in GOOGLE_CLIENT_ID OAUTH_BROKER_URL; do
            if [ -z "${!name}" ]; then
              echo "ERROR: GitHub Actions secret ${name} is not set — see docs/guide/self-hosting.md#google-drive-backup (or set the repository variable DRIVE_BACKUP to 'off' to disable Drive backup)." >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Injecting Google client ID (length: ${#GOOGLE_CLIENT_ID}) and OAuth broker URL"
          # Placeholders are deliberately distinct from the global names
          # (window.__GOOGLE_CLIENT_ID__ etc.) so the substitution can't rewrite them.
          sed -i "s|@@GOOGLE_CLIENT_ID@@|${GOOGLE_CLIENT_ID}|g" _site/config.js
          sed -i "s|@@OAUTH_BROKER_URL@@|${OAUTH_BROKER_URL}|g" _site/config.js
          # Fail the build rather than deploy a config.js that doesn't parse
          node --check _site/config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
