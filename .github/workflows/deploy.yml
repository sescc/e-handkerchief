name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install TypeScript
        run: npm install -g typescript

      - name: Compile TypeScript (app)
        run: tsc

      - name: Compile TypeScript (service worker)
        run: tsc -p tsconfig.sw.json

      - name: Inject build version into service worker
        run: |
          BUILD_VERSION="${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          echo "Injecting build version: $BUILD_VERSION"
          sed -i "s/__BUILD_VERSION__/${BUILD_VERSION}/g" sw.js
          # Verify the placeholder was replaced
          if grep -q "__BUILD_VERSION__" sw.js; then
            echo "ERROR: build version placeholder not replaced" >&2
            exit 1
          fi

      - name: Prepare deploy directory
        run: |
          mkdir -p _site
          cp index.html app.css manifest.webmanifest sw.js config.js _site/
          cp -r src _site/src
          cp -r icons _site/icons
          # Ensure Jekyll processing is disabled on the deployed site
          touch _site/.nojekyll
          # Remove TypeScript sources from deploy (keep only compiled JS)
          find _site/src -name '*.ts' -delete
          rm -f _site/src/*.map _site/src/**/*.map 2>/dev/null || true

      - name: Inject Google client ID into config.js
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "${GOOGLE_CLIENT_ID}" ]; then
            echo "WARNING: GOOGLE_CLIENT_ID secret is empty — cloud backup will be disabled on the deployed site."
          else
            echo "Injecting Google client ID (length: ${#GOOGLE_CLIENT_ID})"
          fi
          # The placeholder is deliberately distinct from the global name
          # window.__GOOGLE_CLIENT_ID__ so the substitution can't rewrite it.
          sed -i "s|@@GOOGLE_CLIENT_ID@@|${GOOGLE_CLIENT_ID}|g" _site/config.js
          # Fail the build rather than deploy a config.js that doesn't parse
          node --check _site/config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
