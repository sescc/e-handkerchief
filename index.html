<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2d7a4f" />
  <meta name="description" content="e-Handkerchief — capture location-aware notes on the go" />
  <!-- connect-src allows arbitrary https endpoints because the transcription server URL is user-configurable; all other directives remain locked down. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' https:; worker-src 'self';" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <title>e-Handkerchief</title>
</head>
<body>
  <div id="app"></div>
  <script src="config.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
