name = "ehk-oauth"
main = "src/index.js"
compatibility_date = "2024-11-01"

# ALLOWED_ORIGIN, GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are NOT set here.
# They are Worker secrets:
#   npx wrangler secret put ALLOWED_ORIGIN       # e.g. https://<your-user>.github.io (comma-separated list supported)
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#
# Unlike the transcription Worker, leaving ALLOWED_ORIGIN unset DENIES all
# origins, because this Worker uses the site owner's Google client secret.
# Do not add ALLOWED_ORIGIN under [vars]: a plain variable and a secret cannot
# share a name, and `wrangler deploy` would then fail or override the secret.
